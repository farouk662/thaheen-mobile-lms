name: thaheen_lms
description: "Thaheen mobile screening task — offline Arabic-first LMS with video player, built with Flutter/BLoC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  # Framework & Localization
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Persistence (Offline Hive Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media Playback
  video_player: ^2.9.1
  chewie: ^1.8.3

  # UI Preview & Device Emulation
  device_preview: ^1.3.1

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter

  # Code Quality & Tooling
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/videos/
    - assets/images/
    - assets/translations/
